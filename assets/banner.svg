idth="2" d="M 0 290 Q 350 330 700 270 T 1200 300" class="stream-line-reverse"/><path fill="none" stroke="#ec4899" stroke-opacity=".25" stroke-width="1.5" d="M 0 200 Q 400 240 800 180 T 1200 210" class="stream-line"/><line x1="0" x2="1200" y1="0" y2="0" stroke="#38bdf8" stroke-opacity=".1" stroke-width="4" class="scanline-bar"/></g><rect width="1080" height="300" x="60" y="40" fill="#0b1120" fill-opacity=".65" stroke="url(#border-grad)" stroke-width="1.5" filter="url(#shadow)" rx="12"/><g id="foreground-content"><g transform="translate(100, 72)"><rect width="320" height="32" fill="#1e293b" fill-opacity=".8" stroke="#334155" stroke-width="1" rx="16"/><circle cx="18" cy="16" r="5" fill="#22c55e" class="status-pulse"/><text x="32" y="21" class="badge-text">CENTRALIZED LOG ECOSYSTEM</text><rect width="72" height="20" x="235" y="6" fill="#3b82f6" fill-opacity=".25" rx="10"/><text x="271" y="20" fill="#60a5fa" class="badge-tag" text-anchor="middle">2026 EDITION</text></g><text x="100" y="136" class="tagline-text">CURATED REPOSITORY &amp; ARCHITECTURE GUIDE</text><text x="100" y="196" fill="url(#title-grad)" class="title-text" filter="url(#shadow)">Awesome Log Management</text><text x="100" y="238" class="subtitle-text">The Complete Directory of Enterprise SaaS Platforms &amp; Open-Source Log Engines</text><g><g transform="translate(100, 276) translate(0, 0)"><rect width="135" height="30" fill="#1e293b" stroke="#475569" stroke-width="1" rx="15"/><text x="67" y="20" class="badge-tag" text-anchor="middle">⚡ Fast Search</text></g><g transform="translate(100, 276) translate(147, 0)"><rect width="150" height="30" fill="#1e293b" stroke="#475569" stroke-width="1" rx="15"/><text x="75" y="20" class="badge-tag" text-anchor="middle">🔄 Log Pipelines</text></g><g transform="translate(100, 276) translate(309, 0)"><rect width="145" height="30" fill="#1e293b" stroke="#475569" stroke-width="1" rx="15"/><text x="72" y="20" class="badge-tag" text-anchor="middle">📊 Observability</text></g><g 