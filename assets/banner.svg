<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="30%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="grid-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1) translate(0, 0); }
        50% { opacity: 0.65; transform: scale(1.1) translate(-20px, 10px); }
      }
      @keyframes floatOrb {
        0%, 100% { transform: translate(0, 0); opacity: 0.4; }
        50% { transform: translate(30px, -20px); opacity: 0.7; }
      }
      @keyframes logStream {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes liveStatus {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px #22c55e); }
        50% { opacity: 0.4; filter: drop-shadow(0 0 1px #22c55e); }
      }
      @keyframes scanline {
        0% { transform: translateY(0); opacity: 0.05; }
        50% { opacity: 0.15; }
        100% { transform: translateY(380px); opacity: 0.05; }
      }

      .bg-orb-1 {
        animation: pulseGlow 8s ease-in-out infinite;
        transform-origin: center;
      }
      .bg-orb-2 {
        animation: floatOrb 10s ease-in-out infinite;
        transform-origin: center;
      }
      .stream-line {
        stroke-dasharray: 60, 40;
        animation: logStream 14s linear infinite;
      }
      .stream-line-reverse {
        stroke-dasharray: 80, 50;
        animation: logStream 18s linear infinite reverse;
      }
      .status-pulse {
        animation: liveStatus 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .scanline-bar {
        animation: scanline 6s ease-in-out infinite;
      }

      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #94a3b8;
        letter-spacing: 0.05em;
      }
      .badge-tag {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 12px;
        font-weight: 500;
        fill: #cbd5e1;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 52px;
        font-weight: 900;
        letter-spacing: -0.02em;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 20px;
        font-weight: 400;
        fill: #94a3b8;
        letter-spacing: 0.01em;
      }
      .tagline-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 14px;
        font-weight: 600;
        fill: #38bdf8;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Base Card Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="380" fill="url(#grid)" />

  <!-- DYNAMIC BACKGROUND LAYER (Behind Content, Low Opacity, Blurred) -->
  <g id="dynamic-ambient-background" opacity="0.85">
    <!-- Animated Light Orbs -->
    <circle cx="180" cy="90" r="140" fill="#3b82f6" filter="url(#soft-glow)" class="bg-orb-1" />
    <circle cx="1020" cy="280" r="160" fill="#a855f7" filter="url(#soft-glow)" class="bg-orb-2" />
    <circle cx="850" cy="80" r="120" fill="#06b6d4" filter="url(#soft-glow)" class="bg-orb-1" />
    <circle cx="340" cy="320" r="130" fill="#ec4899" filter="url(#soft-glow)" class="bg-orb-2" opacity="0.25" />

    <!-- Animated Telemetry & Log Pulse Streams -->
    <path d="M 0 110 Q 300 70 600 130 T 1200 100" fill="none" stroke="#0ea5e9" stroke-width="2.5" stroke-opacity="0.35" class="stream-line" />
    <path d="M 0 290 Q 350 330 700 270 T 1200 300" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.3" class="stream-line-reverse" />
    <path d="M 0 200 Q 400 240 800 180 T 1200 210" fill="none" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.25" class="stream-line" />

    <!-- Subtle Moving Scanline Wave -->
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.1" class="scanline-bar" />
  </g>

  <!-- Foreground Backdrop Tint for Crystal-Clear Text Contrast -->
  <rect x="60" y="40" width="1080" height="300" rx="12" fill="#0b1120" fill-opacity="0.65" stroke="url(#border-grad)" stroke-width="1.5" filter="url(#shadow)" />

  <!-- FOREGROUND STATIC CONTENT LAYER (Always Prominent & Readable) -->
  <g id="foreground-content">
    <!-- Top Pill / Status Indicator -->
    <g transform="translate(100, 72)">
      <rect width="320" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <circle cx="18" cy="16" r="5" fill="#22c55e" class="status-pulse" />
      <text x="32" y="21" class="badge-text">CENTRALIZED LOG ECOSYSTEM</text>
      <rect x="235" y="6" width="72" height="20" rx="10" fill="#3b82f6" fill-opacity="0.25" />
      <text x="271" y="20" text-anchor="middle" class="badge-tag" fill="#60a5fa">2026 EDITION</text>
    </g>

    <!-- Category Tagline -->
    <text x="100" y="136" class="tagline-text">CURATED REPOSITORY &amp; ARCHITECTURE GUIDE</text>

    <!-- Main Title with Gradient Fill -->
    <text x="100" y="196" fill="url(#title-grad)" class="title-text" filter="url(#shadow)">Awesome Log Management</text>

    <!-- Subtitle -->
    <text x="100" y="238" class="subtitle-text">The Complete Directory of Enterprise SaaS Platforms &amp; Open-Source Log Engines</text>

    <!-- Feature Tags / Chips Row -->
    <g transform="translate(100, 276)">
      <!-- Chip 1 -->
      <g transform="translate(0, 0)">
        <rect width="135" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="67" y="20" text-anchor="middle" class="badge-tag">⚡ Fast Search</text>
      </g>
      <!-- Chip 2 -->
      <g transform="translate(147, 0)">
        <rect width="150" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="75" y="20" text-anchor="middle" class="badge-tag">🔄 Log Pipelines</text>
      </g>
      <!-- Chip 3 -->
      <g transform="translate(309, 0)">
        <rect width="145" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="72" y="20" text-anchor="middle" class="badge-tag">📊 Observability</text>
      </g>
      <!-- Chip 4 -->
      <g transform="translate(466, 0)">
        <rect width="145" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="72" y="20" text-anchor="middle" class="badge-tag">🛡️ SIEM &amp; Audit</text>
      </g>
      <!-- Chip 5 -->
      <g transform="translate(623, 0)">
        <rect width="165" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="82" y="20" text-anchor="middle" class="badge-tag">💰 Pricing &amp; Stars</text>
      </g>
    </g>
  </g>

  <!-- Outer Neon Border Accent -->
  <rect x="1" y="1" width="1198" height="378" rx="16" fill="none" stroke="url(#border-grad)" stroke-width="2" opacity="0.6" />
</svg>
